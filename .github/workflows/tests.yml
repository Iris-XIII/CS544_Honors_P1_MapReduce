name: Python tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify generated Boss protobuf files
        run: |
          python -m grpc_tools.protoc -Iproto --python_out=proto --grpc_python_out=proto proto/boss.proto
          git diff --exit-code -- proto/boss_pb2.py proto/boss_pb2_grpc.py
      - name: Run unit and Boss RPC tests
        env:
          PYTHONPATH: proto:.
        run: python -m unittest discover -s tests -p 'test_*.py' -v
